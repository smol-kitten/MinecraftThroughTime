# Caller stub → private vulnerability reporting + security policy check (public repo).
# Advisory (strict: false). See workcollection/fleet-actions docs/TAG-PLAN.md.
name: PVR check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '7 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pvr:
    uses: workcollection/fleet-actions/.github/workflows/pvr-check.yml@v2.0.0
    with:
      runs-on: self-hosted
      strict: false
