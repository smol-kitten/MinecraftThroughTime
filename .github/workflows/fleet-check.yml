# Caller stub → fleet hygiene assertions (license / dependabot / security-scan present,
# fork-exposure detector). Advisory (strict: false) so it reports without reddening the repo.
name: Fleet check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    uses: workcollection/fleet-actions/.github/workflows/fleet-check.yml@v2.1.8
    with:
      runs-on: self-hosted
      strict: false
